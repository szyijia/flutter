
# ============================================================================
# Patchwing Engine Artifact 多平台自动编译
# ============================================================================
# 触发条件:
#   1. 推送 tag（格式: engine-v*，如 engine-v3.44.0）
#   2. 手动触发（workflow_dispatch）
#
# 编译矩阵:
#   - linux-x64   (ubuntu-latest)
#   - darwin-arm64 (macos-14, Apple Silicon)
#   - darwin-x64   (macos-13, Intel)
#
# 产物:
#   patchwing-engine-<flutter_version>-<platform>.zip
#   包含: android_release_arm64/flutter.jar + host_release/gen_snapshot + patchwing.json
#
# 上传目标:
#   MinIO CDN (patchwing.net) 或 GitHub Release
# ============================================================================

name: Build Engine Artifact

on:
  push:
    tags:
      - 'engine-v*'
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter 版本号（如 3.44.0）'
        required: true
        default: '3.44.0'
      upload_to_minio:
        description: '是否上传到 MinIO CDN'
        required: false
        type: boolean
        default: true

env:
  # 从 tag 或 input 获取版本号
  DEPOT_TOOLS_VERSION: 'main'

jobs:
  # ========================================
  # 准备阶段：确定版本号
  # ========================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      flutter_version: ${{ steps.version.outputs.flutter_version }}
      engine_commit: ${{ steps.commit.outputs.engine_commit }}
    steps:
      - name: 确定 Flutter 版本号
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "flutter_version=${{ github.event.inputs.flutter_version }}" >> $GITHUB_OUTPUT
          else
            # 从 tag 提取版本号: engine-v3.44.0 → 3.44.0
            TAG="${GITHUB_REF#refs/tags/engine-v}"
            echo "flutter_version=${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: 获取 engine commit
        id: commit
        run: |
          echo "engine_commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  # ========================================
  # 编译阶段：多平台并行
  # ========================================
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            gn_host_args: '--runtime-mode=release --no-goma'
            gn_android_args: '--android --android-cpu=arm64 --runtime-mode=release --no-goma'
            gen_snapshot_name: gen_snapshot

          - os: macos-14  # Apple Silicon
            platform: darwin-arm64
            gn_host_args: '--runtime-mode=release --no-goma --mac-cpu=arm64'
            gn_android_args: '--android --android-cpu=arm64 --runtime-mode=release --no-goma'
            gen_snapshot_name: gen_snapshot

          - os: macos-13  # Intel
            platform: darwin-x64
            gn_host_args: '--runtime-mode=release --no-goma'
            gn_android_args: '--android --android-cpu=arm64 --runtime-mode=release --no-goma'
            gen_snapshot_name: gen_snapshot

    runs-on: ${{ matrix.os }}
    env:
      FLUTTER_VERSION: ${{ needs.prepare.outputs.flutter_version }}

    steps:
      # ---- 1. Checkout 源码 ----
      # 使用与本地相同的目录结构：.gclient 和 DEPS 在同一目录，name="."
      - name: Checkout Flutter engine fork
        uses: actions/checkout@v4
        with:
          path: repo

      # ---- 2. 安装 depot_tools ----
      - name: 安装 depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      # ---- 3. 配置 .gclient ----
      - name: 配置 .gclient
        working-directory: repo
        run: |
          cat > .gclient << 'EOF'
          solutions = [
            {
              "name": ".",
              "url": "https://github.com/szyijia/flutter.git",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {
                "download_emsdk": False,
                "release_candidate": False,
                "download_android_deps": True,
              },
            },
          ]
          EOF

      # ---- 4. gclient sync ----
      - name: gclient sync
        working-directory: repo
        run: |
          gclient sync -D --no-history --shallow --jobs 8
        timeout-minutes: 60

      # ---- 6. 安装依赖（Linux） ----
      - name: 安装 Linux 编译依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            ninja-build \
            python3 \
            libglib2.0-dev \
            zip

      # ---- 7. 编译 Android release (arm64) ----
      - name: 编译 android_release_arm64
        working-directory: repo/engine/src/flutter
        run: |
          # 运行 GN 生成构建文件
          python3 tools/gn ${{ matrix.gn_android_args }}
          # Ninja 编译
          ninja -C ../out/android_release_arm64 flutter/lib/snapshot:generate_snapshot_bin flutter.jar
        timeout-minutes: 90

      # ---- 8. 编译 Host release (gen_snapshot) ----
      - name: 编译 host_release
        working-directory: repo/engine/src/flutter
        run: |
          python3 tools/gn ${{ matrix.gn_host_args }}
          ninja -C ../out/host_release gen_snapshot
        timeout-minutes: 60

      # ---- 9. 打包 artifact ----
      - name: 打包 Engine Artifact
        id: package
        run: |
          ARTIFACT_NAME="patchwing-engine-${FLUTTER_VERSION}-${{ matrix.platform }}"
          PACK_DIR="artifact/${ARTIFACT_NAME}"

          mkdir -p "${PACK_DIR}/android_release_arm64"
          mkdir -p "${PACK_DIR}/host_release"

          # 复制 flutter.jar
          cp repo/engine/src/out/android_release_arm64/flutter.jar "${PACK_DIR}/android_release_arm64/"

          # 复制 gen_snapshot
          cp repo/engine/src/out/host_release/${{ matrix.gen_snapshot_name }} "${PACK_DIR}/host_release/gen_snapshot"
          chmod +x "${PACK_DIR}/host_release/gen_snapshot"

          # 计算 hash
          JAR_SHA=$(shasum -a 256 "${PACK_DIR}/android_release_arm64/flutter.jar" | awk '{print $1}')
          JAR_SIZE=$(wc -c < "${PACK_DIR}/android_release_arm64/flutter.jar" | tr -d ' ')
          GS_SHA=$(shasum -a 256 "${PACK_DIR}/host_release/gen_snapshot" | awk '{print $1}')
          GS_SIZE=$(wc -c < "${PACK_DIR}/host_release/gen_snapshot" | tr -d ' ')

          # 生成元数据
          cat > "${PACK_DIR}/patchwing.json" << EOF
          {
            "schema_version": 1,
            "flutter_version": "${FLUTTER_VERSION}",
            "platform": "${{ matrix.platform }}",
            "engine_commit": "${{ needs.prepare.outputs.engine_commit }}",
            "created_at": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')",
            "files": {
              "flutter.jar": {
                "path": "android_release_arm64/flutter.jar",
                "size": ${JAR_SIZE},
                "sha256": "${JAR_SHA}"
              },
              "gen_snapshot": {
                "path": "host_release/gen_snapshot",
                "size": ${GS_SIZE},
                "sha256": "${GS_SHA}"
              }
            }
          }
          EOF

          # 打包 zip
          cd artifact
          zip -r "../${ARTIFACT_NAME}.zip" "${ARTIFACT_NAME}/"
          cd ..

          ZIP_SHA=$(shasum -a 256 "${ARTIFACT_NAME}.zip" | awk '{print $1}')
          ZIP_SIZE=$(wc -c < "${ARTIFACT_NAME}.zip" | tr -d ' ')

          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          echo "zip_path=${ARTIFACT_NAME}.zip" >> $GITHUB_OUTPUT
          echo "zip_sha256=${ZIP_SHA}" >> $GITHUB_OUTPUT
          echo "zip_size=${ZIP_SIZE}" >> $GITHUB_OUTPUT

      # ---- 9. 上传到 GitHub Artifacts（临时存储） ----
      - name: 上传 GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.zip_path }}
          retention-days: 30

  # ========================================
  # 发布阶段：上传到 MinIO CDN + GitHub Release
  # ========================================
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_to_minio == 'true')
    env:
      FLUTTER_VERSION: ${{ needs.prepare.outputs.flutter_version }}

    steps:
      - name: 下载所有平台 artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: 列出产物
        run: |
          echo "=== 编译产物 ==="
          find artifacts/ -name "*.zip" -exec ls -lh {} \;

      # ---- 上传到 MinIO ----
      - name: 安装 MinIO Client (mc)
        run: |
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc

      - name: 配置 MinIO
        run: |
          mc alias set patchwing \
            "${{ secrets.MINIO_ENDPOINT }}" \
            "${{ secrets.MINIO_ACCESS_KEY }}" \
            "${{ secrets.MINIO_SECRET_KEY }}"
          # 验证连接
          mc ls patchwing/patchwing/ || echo "Warning: 无法列出 bucket 内容"

      - name: 上传到 MinIO CDN
        run: |
          CDN_PATH="patchwing/engine/${FLUTTER_VERSION}"

          # 确保 bucket 存在
          mc mb --ignore-existing patchwing/patchwing

          for zip in artifacts/patchwing-engine-*/patchwing-engine-*.zip; do
            if [ -f "$zip" ]; then
              FILENAME=$(basename "$zip")
              echo "上传: ${FILENAME} → ${CDN_PATH}/"
              mc cp "$zip" "patchwing/${CDN_PATH}/${FILENAME}"

              # 生成 sha256 文件
              SHA=$(sha256sum "$zip" | awk '{print $1}')
              echo "$SHA" > "${zip}.sha256"
              mc cp "${zip}.sha256" "patchwing/${CDN_PATH}/${FILENAME}.sha256"
            fi
          done

          # 生成 latest.json（供 CLI 查询）
          cat > /tmp/latest.json << EOF
          {
            "flutter_version": "${FLUTTER_VERSION}",
            "engine_commit": "${{ needs.prepare.outputs.engine_commit }}",
            "platforms": ["linux-x64", "darwin-arm64", "darwin-x64"],
            "created_at": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')",
            "base_url": "http://116.204.74.120:29000/patchwing/engine/${FLUTTER_VERSION}"
          }
          EOF
          mc cp /tmp/latest.json "patchwing/${CDN_PATH}/latest.json"

          echo ""
          echo "✅ 上传完成！"
          echo "  URL: http://116.204.74.120:29000/patchwing/engine/${FLUTTER_VERSION}/"

      # ---- 创建 GitHub Release ----
      - name: 创建 GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: "Engine Artifact v${{ env.FLUTTER_VERSION }}"
          body: |
            ## Patchwing Engine Artifact

            **Flutter Version:** ${{ env.FLUTTER_VERSION }}
            **Engine Commit:** ${{ needs.prepare.outputs.engine_commit }}

            ### 平台支持

            | 平台 | 文件 |
            |------|------|
            | Linux x64 | `patchwing-engine-${{ env.FLUTTER_VERSION }}-linux-x64.zip` |
            | macOS ARM64 | `patchwing-engine-${{ env.FLUTTER_VERSION }}-darwin-arm64.zip` |
            | macOS x64 | `patchwing-engine-${{ env.FLUTTER_VERSION }}-darwin-x64.zip` |

            ### 安装方式

            ```bash
            # 自动安装（推荐）
            pw doctor --fix

            # 手动安装
            mkdir -p ~/.patchwing/engine/${{ env.FLUTTER_VERSION }}
            cd ~/.patchwing/engine/${{ env.FLUTTER_VERSION }}
            curl -sSL <下载链接> -o engine.zip && unzip engine.zip && rm engine.zip
            ```
          files: |
            artifacts/patchwing-engine-*/*.zip
          draft: false
          prerelease: false
