# ============================================================================
# Patchwing CLI 全平台编译
# ============================================================================
# 触发条件:
#   1. 推送 tag（格式: cli-v*，如 cli-v0.1.0）
#   2. 手动触发（workflow_dispatch）
#
# 编译平台:
#   - darwin-arm64  (macos-14, 原生编译)
#   - darwin-x64    (macos-14, 通过 Rosetta 2 / arch -x86_64)
#   - linux-x64     (ubuntu-latest)
#   - linux-arm64   (ubuntu-latest, Docker QEMU)
#   - windows-x64   (windows-latest)
#
# 产物:
#   pw-<platform>[.exe]
#
# 上传目标:
#   MinIO CDN: /patchwing/cli/<version>/pw-<platform>
# ============================================================================

name: Build CLI

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      upload_to_minio:
        description: '是否上传到 MinIO CDN'
        required: false
        type: boolean
        default: true

jobs:
  # ========================================
  # macOS 编译（darwin-arm64 + darwin-x64）
  # ========================================
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: 获取版本号
        id: version
        run: |
          VERSION=$(grep '^version:' cli/pubspec.yaml | awk '{print $2}')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 CLI Version: ${VERSION}"

      - name: 安装依赖
        working-directory: cli
        run: dart pub get --no-precompile

      # ---- 编译 darwin-arm64（原生） ----
      - name: 编译 darwin-arm64
        working-directory: cli
        run: |
          dart compile exe bin/pw.dart \
            -o ../build/cli/pw-darwin-arm64 \
            -D version=${{ steps.version.outputs.version }}
          chmod +x ../build/cli/pw-darwin-arm64
          echo "✅ darwin-arm64 编译完成"
          file ../build/cli/pw-darwin-arm64

      # ---- 编译 darwin-x64（通过 Rosetta 2） ----
      - name: 编译 darwin-x64
        working-directory: cli
        run: |
          # 在 Apple Silicon 上通过 arch -x86_64 使用 Rosetta 2 编译 x64 版本
          arch -x86_64 dart compile exe bin/pw.dart \
            -o ../build/cli/pw-darwin-x64 \
            -D version=${{ steps.version.outputs.version }}
          chmod +x ../build/cli/pw-darwin-x64
          echo "✅ darwin-x64 编译完成"
          file ../build/cli/pw-darwin-x64

      - name: 上传 darwin-arm64
        uses: actions/upload-artifact@v4
        with:
          name: pw-darwin-arm64
          path: build/cli/pw-darwin-arm64
          retention-days: 30

      - name: 上传 darwin-x64
        uses: actions/upload-artifact@v4
        with:
          name: pw-darwin-x64
          path: build/cli/pw-darwin-x64
          retention-days: 30

  # ========================================
  # Linux x64 编译
  # ========================================
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: 获取版本号
        id: version
        run: |
          VERSION=$(grep '^version:' cli/pubspec.yaml | awk '{print $2}')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: 安装依赖
        working-directory: cli
        run: dart pub get --no-precompile

      - name: 编译 linux-x64
        working-directory: cli
        run: |
          dart compile exe bin/pw.dart \
            -o ../build/cli/pw-linux-x64 \
            -D version=${{ steps.version.outputs.version }}
          chmod +x ../build/cli/pw-linux-x64
          echo "✅ linux-x64 编译完成"
          file ../build/cli/pw-linux-x64

      - name: 上传 linux-x64
        uses: actions/upload-artifact@v4
        with:
          name: pw-linux-x64
          path: build/cli/pw-linux-x64
          retention-days: 30

  # ========================================
  # Linux arm64 编译（Docker + QEMU）
  # ========================================
  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置 QEMU（用于 arm64 模拟）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 获取版本号
        id: version
        run: |
          VERSION=$(grep '^version:' cli/pubspec.yaml | awk '{print $2}')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: 编译 linux-arm64（Docker）
        run: |
          mkdir -p build/cli
          # 只挂载 cli/ 目录，避免仓库根目录的 workspace pubspec.yaml 被 Dart 解析
          docker run --rm \
            --platform linux/arm64 \
            -v "${{ github.workspace }}/cli:/cli" \
            -v "${{ github.workspace }}/build/cli:/output" \
            -w /cli \
            dart:stable \
            bash -c "dart pub get --no-precompile && dart compile exe bin/pw.dart -o /output/pw-linux-arm64 -D version=${{ steps.version.outputs.version }}"
          chmod +x build/cli/pw-linux-arm64
          echo "✅ linux-arm64 编译完成"
          file build/cli/pw-linux-arm64

      - name: 上传 linux-arm64
        uses: actions/upload-artifact@v4
        with:
          name: pw-linux-arm64
          path: build/cli/pw-linux-arm64
          retention-days: 30

  # ========================================
  # Windows x64 编译
  # ========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: 获取版本号
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' cli/pubspec.yaml | awk '{print $2}')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: 安装依赖
        working-directory: cli
        run: dart pub get --no-precompile

      - name: 编译 windows-x64
        working-directory: cli
        run: |
          dart compile exe bin/pw.dart -o ../build/cli/pw-windows-x64.exe -D version=${{ steps.version.outputs.version }}

      - name: 上传 windows-x64
        uses: actions/upload-artifact@v4
        with:
          name: pw-windows-x64
          path: build/cli/pw-windows-x64.exe
          retention-days: 30

  # ========================================
  # 发布阶段：上传到 MinIO CDN
  # ========================================
  release:
    needs: [build-macos, build-linux-x64, build-linux-arm64, build-windows]
    if: always() && !cancelled() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_to_minio != 'false'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（获取版本号）
        uses: actions/checkout@v4

      - name: 获取版本号
        id: version
        run: |
          VERSION=$(grep '^version:' cli/pubspec.yaml | awk '{print $2}')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 CLI Version: ${VERSION}"

      - name: 下载所有平台 artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: 列出产物
        run: |
          echo "=== 编译产物 ==="
          find artifacts/ -type f | sort
          echo ""
          find artifacts/ -type f -exec ls -lh {} \;

      - name: 安装 MinIO Client
        run: |
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc

      - name: 配置 MinIO
        run: |
          mc alias set patchwing \
            "${{ secrets.MINIO_ENDPOINT }}" \
            "${{ secrets.MINIO_ACCESS_KEY }}" \
            "${{ secrets.MINIO_SECRET_KEY }}"

      - name: 上传到 MinIO CDN
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CDN_PATH="patchwing/cli/${VERSION}"

          # 确保 bucket 存在
          mc mb --ignore-existing patchwing/patchwing

          UPLOADED=0
          for dir in artifacts/pw-*/; do
            for bin_file in "$dir"pw-*; do
              if [ -f "$bin_file" ]; then
                FILENAME=$(basename "$bin_file")
                echo "上传: ${FILENAME} → ${CDN_PATH}/"
                mc cp "$bin_file" "patchwing/${CDN_PATH}/${FILENAME}"
                # 同步到 latest 目录
                mc cp "$bin_file" "patchwing/patchwing/cli/latest/${FILENAME}"
                UPLOADED=$((UPLOADED + 1))
              fi
            done
          done

          echo ""
          echo "✅ 共上传 ${UPLOADED} 个文件"
          echo "  版本目录: http://116.204.74.120:29000/patchwing/cli/${VERSION}/"
          echo "  最新目录: http://116.204.74.120:29000/patchwing/cli/latest/"

      - name: 构建结果汇总
        run: |
          echo "# 🛠️ CLI 编译结果"
          echo ""
          echo "| 平台 | 状态 |"
          echo "|------|------|"
          echo "| darwin-arm64 | ${{ needs.build-macos.result }} |"
          echo "| darwin-x64 | ${{ needs.build-macos.result }} |"
          echo "| linux-x64 | ${{ needs.build-linux-x64.result }} |"
          echo "| linux-arm64 | ${{ needs.build-linux-arm64.result }} |"
          echo "| windows-x64 | ${{ needs.build-windows.result }} |"
