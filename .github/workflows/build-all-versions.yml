# ============================================================================
# Patchwing Engine Artifact 批量构建
# ============================================================================
# 功能：
#   遍历所有 flutter_release/* 分支，为每个版本独立触发编译。
#   任何一个版本失败不会影响其他版本的构建。
#
# 触发条件：
#   手动触发（workflow_dispatch）
#
# 参数：
#   - version_filter: 版本过滤（正则），留空则构建全部版本
#   - skip_existing: 是否跳过 MinIO 上已存在的版本
# ============================================================================

name: Build All Versions

on:
  workflow_dispatch:
    inputs:
      version_filter:
        description: '版本过滤正则（如 "3\\.4[0-9]"），留空则构建全部版本'
        required: false
        default: ''
      skip_existing:
        description: '跳过 MinIO 上已存在的版本'
        required: false
        type: boolean
        default: true
      upload_to_minio:
        description: '是否上传到 MinIO CDN'
        required: false
        type: boolean
        default: true

jobs:
  # ========================================
  # 发现所有需要构建的版本
  # ========================================
  discover:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
      count: ${{ steps.versions.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 MinIO Client
        if: inputs.skip_existing
        run: |
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc

      - name: 配置 MinIO
        if: inputs.skip_existing
        run: |
          mc alias set patchwing \
            "${{ secrets.MINIO_ENDPOINT }}" \
            "${{ secrets.MINIO_ACCESS_KEY }}" \
            "${{ secrets.MINIO_SECRET_KEY }}"
          # 验证连接是否成功
          if ! mc ls patchwing/ >/dev/null 2>&1; then
            echo "⚠️  MinIO 连接失败，将跳过 skip_existing 检查，构建所有版本"
            echo "MINIO_CONNECTED=false" >> $GITHUB_ENV
          else
            echo "✅ MinIO 连接成功"
            echo "MINIO_CONNECTED=true" >> $GITHUB_ENV
          fi

      - name: 发现版本列表
        id: versions
        run: |
          # 获取所有 flutter_release/* 分支的版本号
          ALL_VERSIONS=$(git branch -r | grep 'origin/flutter_release/' | grep -v '_ex/' | sed 's|.*origin/flutter_release/||' | sort -t. -k1,1n -k2,2n -k3,3n)

          # 应用版本过滤
          FILTER="${{ inputs.version_filter }}"
          if [ -n "$FILTER" ]; then
            ALL_VERSIONS=$(echo "$ALL_VERSIONS" | grep -E "$FILTER" || true)
          fi

          # 跳过已存在的版本（仅在 MinIO 连接成功时）
          if [ "${{ inputs.skip_existing }}" = "true" ] && [ "${MINIO_CONNECTED}" = "true" ]; then
            FILTERED_VERSIONS=""
            for ver in $ALL_VERSIONS; do
              # 检查 MinIO 上是否已有该版本的 linux-x64 和 darwin-arm64
              LINUX_EXISTS="no"
              DARWIN_EXISTS="no"
              if mc stat "patchwing/patchwing/engine/${ver}/patchwing-engine-${ver}-linux-x64.zip" >/dev/null 2>&1; then
                LINUX_EXISTS="yes"
              fi
              if mc stat "patchwing/patchwing/engine/${ver}/patchwing-engine-${ver}-darwin-arm64.zip" >/dev/null 2>&1; then
                DARWIN_EXISTS="yes"
              fi

              if [ "$LINUX_EXISTS" = "yes" ] && [ "$DARWIN_EXISTS" = "yes" ]; then
                echo "⏭️  跳过已存在: ${ver}"
              else
                FILTERED_VERSIONS="${FILTERED_VERSIONS} ${ver}"
                echo "📦 需要构建: ${ver} (linux=${LINUX_EXISTS}, darwin=${DARWIN_EXISTS})"
              fi
            done
            ALL_VERSIONS=$(echo "$FILTERED_VERSIONS" | xargs)
          fi

          # 转换为 JSON 数组
          if [ -z "$ALL_VERSIONS" ]; then
            echo "⚠️  没有需要构建的版本"
            echo 'versions=[]' >> $GITHUB_OUTPUT
            echo 'count=0' >> $GITHUB_OUTPUT
          else
            JSON_ARRAY=$(echo "$ALL_VERSIONS" | tr ' ' '\n' | jq -R . | jq -s -c .)
            COUNT=$(echo "$ALL_VERSIONS" | wc -w | tr -d ' ')
            echo "versions=${JSON_ARRAY}" >> $GITHUB_OUTPUT
            echo "count=${COUNT}" >> $GITHUB_OUTPUT
            echo ""
            echo "✅ 共 ${COUNT} 个版本需要构建:"
            echo "$ALL_VERSIONS" | tr ' ' '\n'
          fi

  # ========================================
  # 为每个版本独立构建（互不影响）
  # ========================================
  build-version:
    needs: discover
    if: needs.discover.outputs.count != '0'
    strategy:
      fail-fast: false  # 关键：任何一个版本失败不影响其他版本
      max-parallel: 4   # 控制并发数，避免资源耗尽
      matrix:
        flutter_version: ${{ fromJson(needs.discover.outputs.versions) }}
        platform:
          - os: ubuntu-latest
            name: linux-x64
            gn_host_args: '--runtime-mode=release --no-goma'
            gn_android_args: '--android --android-cpu=arm64 --runtime-mode=release --no-goma'
            host_out_dir: host_release
          - os: macos-14
            name: darwin-arm64
            gn_host_args: '--runtime-mode=release --no-goma --mac-cpu=arm64'
            gn_android_args: '--android --android-cpu=arm64 --runtime-mode=release --no-goma'
            host_out_dir: host_release_arm64

    runs-on: ${{ matrix.platform.os }}
    env:
      FLUTTER_VERSION: ${{ matrix.flutter_version }}

    steps:
      - name: "📋 构建信息: ${{ matrix.flutter_version }} / ${{ matrix.platform.name }}"
        id: info
        run: |
          echo "🔨 Flutter Version: ${{ matrix.flutter_version }}"
          echo "🖥️  Platform: ${{ matrix.platform.name }}"
          echo "🏃 Runner: ${{ matrix.platform.os }}"

          # 判断版本类型：3.29+ 为 monorepo，3.10~3.27 为 legacy（独立 engine 仓库）
          MINOR=$(echo "${{ matrix.flutter_version }}" | cut -d. -f2)
          if [ "$MINOR" -ge 29 ]; then
            echo "engine_type=monorepo" >> $GITHUB_OUTPUT
            echo "📦 类型: Monorepo (3.29+)"
          else
            echo "engine_type=legacy" >> $GITHUB_OUTPUT
            echo "📦 类型: Legacy (独立 engine 仓库)"
          fi

      # ---- 1. 安装 depot_tools ----
      - name: 安装 depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      # ---- 2. Checkout + 配置 .gclient（Monorepo 3.29+） ----
      - name: Checkout Flutter monorepo
        if: steps.info.outputs.engine_type == 'monorepo'
        uses: actions/checkout@v4
        with:
          ref: flutter_release/${{ matrix.flutter_version }}
          path: repo

      - name: 配置 .gclient (monorepo)
        if: steps.info.outputs.engine_type == 'monorepo'
        working-directory: repo
        run: |
          cat > .gclient << 'EOF'
          solutions = [
            {
              "name": ".",
              "url": "https://github.com/szyijia/flutter.git@flutter_release/${{ matrix.flutter_version }}",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {
                "download_emsdk": False,
                "release_candidate": False,
                "download_android_deps": True,
              },
            },
          ]
          EOF

      - name: gclient sync (monorepo)
        if: steps.info.outputs.engine_type == 'monorepo'
        working-directory: repo
        run: |
          gclient sync -D --no-history --shallow --jobs 8
        timeout-minutes: 60

      # ---- 2b. Checkout + 配置 .gclient（Legacy 3.10~3.27，独立 engine 仓库） ----
      - name: 配置 .gclient (legacy)
        if: steps.info.outputs.engine_type == 'legacy'
        run: |
          mkdir -p repo
          cat > repo/.gclient << 'EOF'
          solutions = [
            {
              "name": "src/flutter",
              "url": "https://github.com/szyijia/engine.git@flutter_release/${{ matrix.flutter_version }}",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {
                "download_emsdk": False,
                "release_candidate": False,
                "download_android_deps": True,
              },
            },
          ]
          EOF

      - name: gclient sync (legacy)
        if: steps.info.outputs.engine_type == 'legacy'
        working-directory: repo
        run: |
          gclient sync -D --no-history --shallow --jobs 8
        timeout-minutes: 60

      # ---- 3. 统一目录结构：确保 repo/engine/src/flutter 路径可用 ----
      - name: 统一目录结构 (legacy)
        if: steps.info.outputs.engine_type == 'legacy'
        run: |
          # Legacy 结构: repo/src/flutter/ → 创建软链接使路径统一
          # gclient sync 后目录为: repo/src/flutter/ (engine源码)
          # 需要映射为: repo/engine/src/flutter/ (与 monorepo 一致)
          mkdir -p repo/engine
          ln -sf "$(pwd)/repo/src" repo/engine/src

      # ---- 5. 安装 Rust Android 交叉编译 target ----
      - name: 安装 Rust aarch64-linux-android target
        run: |
          rustup target add aarch64-linux-android

      # ---- 6. 安装依赖（Linux） ----
      - name: 安装 Linux 编译依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            ninja-build \
            python3 \
            libglib2.0-dev \
            zip

      # ---- 7. 手动编译 Rust updater（旧版本需要） ----
      # 3.29~3.41.8 版本的 BUILD.gn 硬编码了 libupdater.a 路径，
      # 但 GN/Ninja 不会自动编译它。需要在 ninja 之前手动 cargo build。
      # 3.44.0+ 版本已集成到 GN 中（build_rust_updater.py），会自动编译。
      - name: 编译 Rust updater for Android (旧版本)
        if: steps.info.outputs.engine_type == 'monorepo'
        working-directory: repo/engine/src/flutter
        run: |
          # 检测是否需要手动编译：如果没有 build_rust_updater.gni 则需要
          if [ ! -f "shell/common/shorebird/build_rust_updater.gni" ]; then
            echo "⚠️ 旧版本，需要手动编译 Rust updater..."

            UPDATER_DIR="third_party/updater"
            if [ ! -d "$UPDATER_DIR" ]; then
              echo "❌ updater 目录不存在，跳过（可能 gclient sync 未拉取）"
              exit 0
            fi

            # 配置 Android NDK 环境
            NDK_PATH="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
            if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
              # GitHub Actions 默认 NDK 路径
              NDK_PATH="${ANDROID_HOME}/ndk-bundle"
              if [ ! -d "$NDK_PATH" ]; then
                NDK_PATH=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -1)
              fi
            fi
            echo "NDK Path: $NDK_PATH"

            if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
              echo "❌ 找不到 Android NDK，无法编译 updater"
              exit 1
            fi

            # 确定 host 平台
            if [[ "$OSTYPE" == "linux-gnu"* ]]; then
              HOST_TAG="linux-x86_64"
            elif [[ "$OSTYPE" == "darwin"* ]]; then
              HOST_TAG="darwin-x86_64"
            fi

            TOOLCHAIN_BIN="$NDK_PATH/toolchains/llvm/prebuilt/$HOST_TAG/bin"
            API_LEVEL=21

            # 编译 aarch64-linux-android target
            RUST_TARGET="aarch64-linux-android"
            export CC_aarch64_linux_android="$TOOLCHAIN_BIN/${RUST_TARGET}${API_LEVEL}-clang"
            export AR_aarch64_linux_android="$TOOLCHAIN_BIN/llvm-ar"
            export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN_BIN/${RUST_TARGET}${API_LEVEL}-clang"

            echo "CC=$CC_aarch64_linux_android"
            echo "AR=$AR_aarch64_linux_android"
            echo "LINKER=$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"

            rustup target add $RUST_TARGET

            cd "$UPDATER_DIR"
            cargo build --release --target $RUST_TARGET -p updater

            echo "✅ Rust updater 编译完成"
            ls -la "target/$RUST_TARGET/release/libupdater.a"
          else
            echo "✅ 新版本（有 build_rust_updater.gni），Rust updater 将由 GN/Ninja 自动编译"
          fi

      - name: 编译 Rust updater for Android (legacy)
        if: steps.info.outputs.engine_type == 'legacy'
        working-directory: repo/src
        run: |
          if [ ! -f "flutter/shell/common/shorebird/build_rust_updater.gni" ]; then
            # Legacy 版本的 DEPS 将 updater 放在 src/third_party/updater
            # BUILD.gn 引用路径: //third_party/updater/target/...
            UPDATER_DIR="third_party/updater"
            if [ ! -d "$UPDATER_DIR" ]; then
              echo "⚠️ updater 目录不存在（src/third_party/updater），跳过"
              echo "当前目录: $(pwd)"
              echo "目录内容: $(ls -la third_party/ 2>/dev/null | head -10)"
              exit 0
            fi

            echo "✅ 找到 updater 目录: $(pwd)/$UPDATER_DIR"

            NDK_PATH="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
            if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
              NDK_PATH="${ANDROID_HOME}/ndk-bundle"
              if [ ! -d "$NDK_PATH" ]; then
                NDK_PATH=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -1)
              fi
            fi

            if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
              echo "❌ 找不到 Android NDK"
              exit 1
            fi
            echo "NDK Path: $NDK_PATH"

            if [[ "$OSTYPE" == "linux-gnu"* ]]; then
              HOST_TAG="linux-x86_64"
            elif [[ "$OSTYPE" == "darwin"* ]]; then
              HOST_TAG="darwin-x86_64"
            fi

            TOOLCHAIN_BIN="$NDK_PATH/toolchains/llvm/prebuilt/$HOST_TAG/bin"
            RUST_TARGET="aarch64-linux-android"
            export CC_aarch64_linux_android="$TOOLCHAIN_BIN/${RUST_TARGET}21-clang"
            export AR_aarch64_linux_android="$TOOLCHAIN_BIN/llvm-ar"
            export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN_BIN/${RUST_TARGET}21-clang"

            echo "CC=$CC_aarch64_linux_android"
            echo "AR=$AR_aarch64_linux_android"

            rustup target add $RUST_TARGET
            cd "$UPDATER_DIR"
            cargo build --release --target $RUST_TARGET -p updater
            echo "✅ Rust updater 编译完成"
            ls -la "target/$RUST_TARGET/release/libupdater.a"
          else
            echo "✅ 新版本，跳过"
          fi

      # ---- 8. 编译 Android release (arm64) ----
      - name: 编译 android_release_arm64 (monorepo)
        if: steps.info.outputs.engine_type == 'monorepo'
        working-directory: repo/engine/src/flutter
        run: |
          python3 tools/gn ${{ matrix.platform.gn_android_args }}
          ninja -C ../out/android_release_arm64 flutter/lib/snapshot:generate_snapshot_bin flutter.jar
        timeout-minutes: 90

      - name: 编译 android_release_arm64 (legacy)
        if: steps.info.outputs.engine_type == 'legacy'
        working-directory: repo/src/flutter
        run: |
          python3 tools/gn ${{ matrix.platform.gn_android_args }}
          ninja -C ../out/android_release_arm64 flutter/lib/snapshot:generate_snapshot_bin flutter.jar
        timeout-minutes: 90

      # ---- 9. 编译 Rust updater for host（旧版本需要） ----
      - name: 编译 Rust updater for host (旧版本, monorepo)
        if: steps.info.outputs.engine_type == 'monorepo'
        working-directory: repo/engine/src/flutter
        run: |
          if [ ! -f "shell/common/shorebird/build_rust_updater.gni" ]; then
            UPDATER_DIR="third_party/updater"
            if [ ! -d "$UPDATER_DIR" ]; then
              echo "⚠️ updater 目录不存在，跳过"
              exit 0
            fi

            if [[ "$OSTYPE" == "linux-gnu"* ]]; then
              RUST_TARGET="x86_64-unknown-linux-gnu"
            elif [[ "$OSTYPE" == "darwin"* ]]; then
              if [[ "$(uname -m)" == "arm64" ]]; then
                RUST_TARGET="aarch64-apple-darwin"
              else
                RUST_TARGET="x86_64-apple-darwin"
              fi
            fi

            if [ -n "$RUST_TARGET" ]; then
              echo "⚠️ 编译 host updater: $RUST_TARGET"
              rustup target add $RUST_TARGET
              cd "$UPDATER_DIR"
              cargo build --release --target $RUST_TARGET -p updater
              echo "✅ Host updater 编译完成"
              ls -la "target/$RUST_TARGET/release/libupdater.a"
            fi
          else
            echo "✅ 新版本，跳过"
          fi

      - name: 编译 Rust updater for host (旧版本, legacy)
        if: steps.info.outputs.engine_type == 'legacy'
        working-directory: repo/src
        run: |
          if [ ! -f "flutter/shell/common/shorebird/build_rust_updater.gni" ]; then
            UPDATER_DIR="third_party/updater"
            if [ ! -d "$UPDATER_DIR" ]; then
              echo "⚠️ updater 目录不存在，跳过"
              exit 0
            fi

            if [[ "$OSTYPE" == "linux-gnu"* ]]; then
              RUST_TARGET="x86_64-unknown-linux-gnu"
            elif [[ "$OSTYPE" == "darwin"* ]]; then
              if [[ "$(uname -m)" == "arm64" ]]; then
                RUST_TARGET="aarch64-apple-darwin"
              else
                RUST_TARGET="x86_64-apple-darwin"
              fi
            fi

            if [ -n "$RUST_TARGET" ]; then
              echo "⚠️ 编译 host updater: $RUST_TARGET"
              rustup target add $RUST_TARGET
              cd "$UPDATER_DIR"
              cargo build --release --target $RUST_TARGET -p updater
              echo "✅ Host updater 编译完成"
              ls -la "target/$RUST_TARGET/release/libupdater.a"
            fi
          else
            echo "✅ 新版本，跳过"
          fi

      # ---- 10. 编译 Host release (gen_snapshot) ----
      - name: 编译 host_release (monorepo)
        if: steps.info.outputs.engine_type == 'monorepo'
        working-directory: repo/engine/src/flutter
        run: |
          python3 tools/gn ${{ matrix.platform.gn_host_args }}
          ninja -C ../out/${{ matrix.platform.host_out_dir }} gen_snapshot
        timeout-minutes: 60

      - name: 编译 host_release (legacy)
        if: steps.info.outputs.engine_type == 'legacy'
        working-directory: repo/src/flutter
        run: |
          python3 tools/gn ${{ matrix.platform.gn_host_args }}
          ninja -C ../out/${{ matrix.platform.host_out_dir }} gen_snapshot
        timeout-minutes: 60

      # ---- 9. 打包 artifact ----
      - name: 打包 Engine Artifact
        id: package
        run: |
          ARTIFACT_NAME="patchwing-engine-${FLUTTER_VERSION}-${{ matrix.platform.name }}"
          PACK_DIR="artifact/${ARTIFACT_NAME}"

          mkdir -p "${PACK_DIR}/android_release_arm64"
          mkdir -p "${PACK_DIR}/host_release"

          # 根据版本类型确定输出目录
          if [ "${{ steps.info.outputs.engine_type }}" = "monorepo" ]; then
            OUT_DIR="repo/engine/src/out"
          else
            OUT_DIR="repo/src/out"
          fi

          # 复制 flutter.jar
          cp "${OUT_DIR}/android_release_arm64/flutter.jar" "${PACK_DIR}/android_release_arm64/"

          # 复制 gen_snapshot
          cp "${OUT_DIR}/${{ matrix.platform.host_out_dir }}/gen_snapshot" "${PACK_DIR}/host_release/gen_snapshot"
          chmod +x "${PACK_DIR}/host_release/gen_snapshot"

          # 计算 hash
          JAR_SHA=$(shasum -a 256 "${PACK_DIR}/android_release_arm64/flutter.jar" | awk '{print $1}')
          JAR_SIZE=$(wc -c < "${PACK_DIR}/android_release_arm64/flutter.jar" | tr -d ' ')
          GS_SHA=$(shasum -a 256 "${PACK_DIR}/host_release/gen_snapshot" | awk '{print $1}')
          GS_SIZE=$(wc -c < "${PACK_DIR}/host_release/gen_snapshot" | tr -d ' ')

          # 生成元数据
          ENGINE_COMMIT=$(cd repo && git rev-parse HEAD)
          cat > "${PACK_DIR}/patchwing.json" << EOF
          {
            "schema_version": 1,
            "flutter_version": "${FLUTTER_VERSION}",
            "platform": "${{ matrix.platform.name }}",
            "engine_commit": "${ENGINE_COMMIT}",
            "created_at": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')",
            "files": {
              "flutter.jar": {
                "path": "android_release_arm64/flutter.jar",
                "size": ${JAR_SIZE},
                "sha256": "${JAR_SHA}"
              },
              "gen_snapshot": {
                "path": "host_release/gen_snapshot",
                "size": ${GS_SIZE},
                "sha256": "${GS_SHA}"
              }
            }
          }
          EOF

          # 打包 zip
          cd artifact
          zip -r "../${ARTIFACT_NAME}.zip" "${ARTIFACT_NAME}/"
          cd ..

          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          echo "zip_path=${ARTIFACT_NAME}.zip" >> $GITHUB_OUTPUT

      # ---- 10. 上传到 GitHub Artifacts ----
      - name: 上传 GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.zip_path }}
          retention-days: 7

  # ========================================
  # 发布阶段：统一上传到 MinIO
  # ========================================
  upload:
    needs: [discover, build-version]
    if: always() && needs.discover.outputs.count != '0' && !cancelled()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter_version: ${{ fromJson(needs.discover.outputs.versions) }}

    steps:
      - name: 下载该版本的 artifact
        uses: actions/download-artifact@v4
        with:
          pattern: patchwing-engine-${{ matrix.flutter_version }}-*
          path: artifacts/
          merge-multiple: false

      - name: 检查是否有产物
        id: check
        run: |
          if find artifacts/ -name "*.zip" | grep -q .; then
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
            echo "✅ 找到 ${{ matrix.flutter_version }} 的编译产物"
            find artifacts/ -name "*.zip" -exec ls -lh {} \;
          else
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
            echo "⚠️  ${{ matrix.flutter_version }} 没有编译产物（可能编译失败）"
          fi

      - name: 安装 MinIO Client
        if: steps.check.outputs.has_artifacts == 'true' && inputs.upload_to_minio
        run: |
          curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc

      - name: 配置 MinIO
        if: steps.check.outputs.has_artifacts == 'true' && inputs.upload_to_minio
        run: |
          mc alias set patchwing \
            "${{ secrets.MINIO_ENDPOINT }}" \
            "${{ secrets.MINIO_ACCESS_KEY }}" \
            "${{ secrets.MINIO_SECRET_KEY }}"

      - name: 上传到 MinIO CDN
        if: steps.check.outputs.has_artifacts == 'true' && inputs.upload_to_minio
        run: |
          VERSION="${{ matrix.flutter_version }}"
          CDN_PATH="patchwing/engine/${VERSION}"

          # 确保 bucket 存在
          mc mb --ignore-existing patchwing/patchwing

          for zip in artifacts/patchwing-engine-*/patchwing-engine-*.zip; do
            if [ -f "$zip" ]; then
              FILENAME=$(basename "$zip")
              echo "上传: ${FILENAME} → ${CDN_PATH}/"
              mc cp "$zip" "patchwing/${CDN_PATH}/${FILENAME}"

              # 生成 sha256 文件
              SHA=$(sha256sum "$zip" | awk '{print $1}')
              echo "$SHA" > "${zip}.sha256"
              mc cp "${zip}.sha256" "patchwing/${CDN_PATH}/${FILENAME}.sha256"
            fi
          done

          echo "✅ ${VERSION} 上传完成"

  # ========================================
  # 汇总报告
  # ========================================
  summary:
    needs: [discover, build-version, upload]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 构建结果汇总
        run: |
          echo "# 🏗️ 批量构建结果汇总"
          echo ""
          echo "- 📊 计划构建版本数: ${{ needs.discover.outputs.count }}"
          echo "- 🔨 构建阶段状态: ${{ needs.build-version.result }}"
          echo "- 📤 上传阶段状态: ${{ needs.upload.result }}"
          echo ""
          if [ "${{ needs.build-version.result }}" = "success" ]; then
            echo "✅ 所有版本构建成功！"
          elif [ "${{ needs.build-version.result }}" = "failure" ]; then
            echo "⚠️  部分版本构建失败，但其他版本不受影响。请检查具体失败的 job。"
          fi
